<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل جواز السفر</title>
  <style>
    body {
      background: url('https://i.postimg.cc/JhKnMv57/FB-IMG-1753464094985.jpg') no-repeat center center fixed;
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      max-width: 320px;
      width: 90%;
      text-align: center;
    }
    input, button {
      margin: 10px 0;
      padding: 10px;
      width: 90%;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background: #007bff;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover {
      background: #0056b3;
    }
    button:disabled {
      background: #99c2e8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
      min-height: 20px;
    }
    .info {
      margin-top: 10px;
      color: #444;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>تحميل جواز السفر</h2>
    <form id="passportForm">
      <input type="text" name="name" placeholder="الاسم الكامل" required>
      <input type="tel" name="phone" placeholder="رقم الهاتف" required>
      <input type="file" name="passport" accept=".pdf,.jpg,.jpeg,.png" required>
      <button type="submit" id="submitBtn">إرسال</button>
    </form>
    <p id="status"></p>
    <p class="info">🔒 نطمئنك أن وثائقك محفوظة ومحمية بإذن الله.</p>
  </div>

  <script>
    // ⚠️ ضع هنا رابط الـ Web App الذي حصلت عليه بعد Deploy لملف Code.gs
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0a49IM7hbe76eNM6mWA3UqF0rKR0Rhz_qqJ_p7x2u7tdaeXk8BtGxpp98B02b-uJB/exec";

    document.getElementById("passportForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const form = e.target;
      const submitBtn = document.getElementById("submitBtn");
      const statusEl = document.getElementById("status");
      const formData = new FormData(form);
      const file = formData.get("passport");

      if (!file || file.size === 0) {
        statusEl.innerText = "❌ لم يتم اختيار ملف.";
        return;
      }

      // حد أقصى معقول لحجم الملف (مثلاً 8 ميغابايت) لتفادي فشل الإرسال
      const MAX_SIZE = 8 * 1024 * 1024;
      if (file.size > MAX_SIZE) {
        statusEl.innerText = "❌ حجم الملف كبير جداً (الحد الأقصى 8 ميغابايت).";
        return;
      }

      submitBtn.disabled = true;
      statusEl.innerText = "⏳ جاري الإرسال...";

      const reader = new FileReader();
      reader.onload = async function () {
        const base64File = reader.result.split(",")[1];
        const payload = new URLSearchParams();
        payload.append("sheet", "passport"); // مهم: يوجّه الطلب لمعالج جواز السفر في Code.gs
        payload.append("name", formData.get("name"));
        payload.append("phone", formData.get("phone"));
        payload.append("fileName", file.name);
        payload.append("mimeType", file.type);
        payload.append("fileData", base64File);

        try {
          const response = await fetch(SCRIPT_URL, {
            method: "POST",
            body: payload,
          });
          const result = await response.json();
          statusEl.innerText = result.message || (result.success ? "✅ تم بنجاح" : "❌ حدث خطأ");

          if (result.success && result.redirect) {
            setTimeout(() => {
              window.location.href = result.redirect;
            }, 3000);
          } else {
            submitBtn.disabled = false;
          }
        } catch (err) {
          statusEl.innerText = "❌ فشل في الاتصال بالخادم.";
          submitBtn.disabled = false;
        }
      };
      reader.onerror = function () {
        statusEl.innerText = "❌ فشل في قراءة الملف.";
        submitBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>

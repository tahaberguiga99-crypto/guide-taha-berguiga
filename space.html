<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فضاء المعتمر | طريق العمرة</title>

<style>
/* ================== GLOBAL ================== */
*{box-sizing:border-box}
body{
  font-family:'Tajawal',Tahoma,Arial,sans-serif;
  margin:0;
  background:#f2f4f8;
}

/* ================== TOP BAR ================== */
.topbar{
  background:#FFD700;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}
.menu-btn{
  font-size:26px;
  font-weight:900;
  cursor:pointer;
}

/* ================== PAGE ================== */
.page{
  max-width:900px;
  margin:30px auto;
  padding:15px;
}
.card{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}
input,button{
  padding:14px;
  font-size:18px;
  width:100%;
  margin-top:10px;
}
button{
  background:#0d6efd;
  color:#fff;
  border:none;
  cursor:pointer;
}
.btns{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.btns button{
  width:auto;
}

/* ================== WAIT BOX ================== */
#waitBox{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#f9f9f9;
  border-radius:12px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#0d6efd;
}

/* ================== LOGOS ================== */
.logos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin:20px 0;
}
.logos img{
  width:30px;
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
  transition:.3s;
}
.logos img:hover{
  transform:scale(1.1);
}

/* ================== PRINT ================== */
@page{
  size:A4 landscape;
  margin:15mm;
}
@media print{
  body{background:white}
}

/* ===== PRINT HEADER ===== */
.print-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #000;
  padding-bottom:10px;
}
.print-header img{
  height:60px;
}
.print-title{
  font-size:20px;
  font-weight:bold;
}

/* ===== TABLE ===== */
.table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:16px;
}
.table td{
  border:1px solid #000;
  padding:10px;
}
.table .label{
  font-weight:bold;
  width:30%;
  background:#f3f3f3;
}

/* ================== STICKER ================== */
.sticker{
  width:100%;
  text-align:center;
  font-weight:bold;
}
.sticker-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}
.sticker-header img{
  height:10px;
}
.sticker .name{
  font-size:20px;
  margin:20px 0;
}
.sticker .agency{
  font-size:20px;
  margin:20px 0;
}
.sticker .phone{
  font-size:50px;
  margin-top:20px;
}

/* ================== MOBILE ================== */
@media(max-width:768px){
  .logos img{width:26px}
  .sticker .name{font-size:40px}
  .sticker .agency{font-size:36px}
  .sticker .phone{font-size:32px}
}
@media(max-width:480px){
  .logos img{width:22px}
}
</style>
</head>

<body>

<div class="topbar">
  <span class="menu-btn">☰</span>
  <strong>🕋 طريق العمرة</strong>
</div>

<div class="page">
  <div class="card">
    <h3 style="font-size:22px">🔍 البحث عن المعتمر</h3>

    <input
      id="phone"
      type="tel"
      placeholder="أدخل رقم الهاتف "
      maxlength="10"
      onfocus="fixZero(this)"
      oninput="fixZero(this)"
    >

    <button onclick="search()">بحث</button>

    <div id="waitBox" style="display:none;margin-top:20px;padding:20px;background:#f9f9f9;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#0d6efd;">
      ⏳ جارٍ البحث…<br>
      <span id="dhikr">أستغفر الله</span>
    </div>

    <div id="result"></div>
  </div>
</div>

<script>
const webAppUrl = "https://script.google.com/macros/s/AKfycbxNQlPGbAZyLypzmxm9qqt5WJCA8uRCyTmtZBY8JIo01LLzB_HY1X4Odg2Cv_xcTKHmxQ/exec";
const mainLogo = "https://i.ibb.co/HDMQfZKG/1766852333847-removebg-preview.png";

function getAgencyLogo(name=""){
  name=name.replace(/\s+/g,"");
  if(name.includes("تقرت")) return "https://i.ibb.co/2XWLPsc/1766858356356-removebg-preview.png";
  if(name.includes("الانسية")) return "https://i.ibb.co/Mk97KqGK/FB-IMG-1766861138141-removebg-preview.png";
  if(name.includes("السقيفة")) return "https://i.ibb.co/mmrx9QG/FB-IMG-1766861105309-removebg-preview.png";
  return "";
}

let data=null;
const result = document.getElementById("result");

function fixZero(input){
  input.value = input.value.replace(/[^0-9]/g,"");
  if(input.value.length === 1 && input.value !== "0") input.value = "0";
}

function preparePhone(p){
  p=p.replace(/\D/g,"");
  if(p.startsWith("0")) p=p.slice(1);
  if(p.startsWith("213")) p=p.slice(3);
  return p;
}

function statusBlock(url){
  return url
    ? `<span class="status-ok">تم إصدارها</span> <a class="download-btn" href="${url}" target="_blank">⬇ تحميل</a>`
    : `<span class="status-no">لم يتم إصدارها بعد</span>`;
}

const adhkar = [
  "أستغفر الله",
  "سبحان الله",
  "الحمد لله",
  "لا إله إلا الله",
  " الله أكبر"
];
let dhikrTimer=null;

function startWaiting(){
  const box=document.getElementById("waitBox");
  const text=document.getElementById("dhikr");
  let i=0;
  box.style.display="block";
  dhikrTimer=setInterval(()=>text.innerText=adhkar[i++%adhkar.length],1500);
}

function stopWaiting(){
  clearInterval(dhikrTimer);
  document.getElementById("waitBox").style.display="none";
}

function search(){
  const phone=preparePhone(document.getElementById("phone").value);
  if(phone.length<9){alert("رقم غير صحيح");return;}
  startWaiting();
  fetch(webAppUrl+"?phone="+phone)
    .then(r=>r.json())
    .then(d=>{
      stopWaiting();
      if(!d.found){result.innerHTML="❌ لم يتم العثور";return;}
      data=d;
      result.innerHTML=`
      <hr>
      <p><b>الاسم:</b> ${d.firstName} ${d.lastName}</p>
      <p><b>الهاتف:</b> ${d.phone}</p>
      <p><b>الوكالة:</b> ${d.agency}</p>
      <p><b>التأشيرة:</b> ${statusBlock(d.visaImage)}</p>
      <p><b>التذكرة:</b> ${statusBlock(d.ticketImage)}</p>
      <div class="btns">
        <button onclick="printData()">🖨️ طباعة</button>
        <button onclick="printSticker()">🧳 ملصق</button>
      </div>`;
    });
}

function openPrint(html){
  const w=window.open("");
  w.document.write(`<html><head><meta charset="UTF-8"></head><body>${html}</body></html>`);
  w.document.close();
  w.print();
}

function printData(){
  if(!data) return;
  openPrint(`
  <div class="print-a3">
    <div class="print-header">
      <img src="${mainLogo}">
      <div class="print-title">استمارة معتمر</div>
      <img src="${getAgencyLogo(data.agency)}">
    </div>
    <table class="table">
      <tr><td class="label">الاسم</td><td>${data.firstName} ${data.lastName}</td></tr>
      <tr><td class="label">الهاتف</td><td>${data.phone}</td></tr>
      <tr><td class="label">الوكالة</td><td>${data.agency}</td></tr>
    </table>
  </div>`);
}

function printSticker(){
  if(!data) return;
  openPrint(`
  <div class="sticker">
    <div class="sticker-header">
      <img src="${mainLogo}">
      <img src="${getAgencyLogo(data.agency)}">
    </div>

    <div class="name">${data.firstName} ${data.lastName}</div>
    <div class="agency">${data.agency}</div>
    <div class="phone">${data.phone}</div>
  </div>
  `);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="آراء وتعليقات المعتمرين حول تجربتهم">
  <title>آراء المعتمرين</title>
  <style>
    * { box-sizing: border-box; }

    body {
      background: url('https://i.postimg.cc/W36hVtzB/FB-IMG-1753465795592.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', sans-serif;
      min-height: 100vh;
    }

    nav {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      padding: 8px 12px;
    }
    nav a:hover, nav a:focus-visible {
      color: #ffd700;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      max-width: 700px;
      margin: 20px auto;
    }

    h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 15px;
      font-size: 1.8em;
    }

    .comment-box, .comment {
      background: #fff;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-top: 8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid #007bff;
      outline-offset: 1px;
    }

    .char-count {
      font-size: 12px;
      color: #888;
      text-align: left;
      margin-top: -2px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      margin-top: 5px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: #0056b3;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .action-btn {
      width: auto;
      display: inline-block;
      margin-left: 6px;
      padding: 6px 12px;
      font-size: 13px;
    }

    .reply-box {
      margin-right: 20px;
      margin-top: 10px;
      background: #f1f1f1;
      padding: 6px;
      border-radius: 5px;
      font-size: 13px;
    }

    .likes {
      color: #e91e63;
      margin-left: 10px;
      font-size: 14px;
    }

    .delete-btn {
      background: #dc3545;
    }
    .delete-btn:hover:not(:disabled) {
      background: #a71d2a;
    }

    .site-like {
      margin-bottom: 15px;
      text-align: center;
    }
    .site-like button {
      width: auto;
      display: inline-block;
      padding: 10px 20px;
    }

    #siteLikeStatus {
      margin-top: 6px;
      font-size: 14px;
      color: #555;
    }

    .status-msg {
      text-align: center;
      color: #777;
      font-size: 14px;
      padding: 10px;
    }
    .error-msg {
      text-align: center;
      color: #b00020;
      font-size: 14px;
      padding: 10px;
      background: #fdecea;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
        margin: 10px;
      }
      button {
        font-size: 16px;
        padding: 12px;
      }
      h2 {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">🏠 الرئيسية</a>
  </nav>

  <div class="container">
    <h2>آراء المعتمرين</h2>

    <div class="site-like">
      <button id="siteLikeBtn" onclick="likeSite()">❤️ أعجبني الموقع</button>
      <div id="siteLikeStatus"></div>
    </div>

    <div class="comment-box">
      <label for="name">الاسم</label>
      <input type="text" id="name" placeholder="الاسم" maxlength="50">

      <label for="wilaya">الولاية</label>
      <select id="wilaya">
        <option value="">اختر ولايتك</option>
      </select>

      <label for="comment">تعليقك</label>
      <textarea id="comment" placeholder="اكتب تعليقك هنا..." maxlength="500" rows="4" oninput="updateCharCount()"></textarea>
      <div class="char-count" id="charCount">0 / 500</div>

      <button id="submitBtn" onclick="addComment()">إرسال التعليق</button>
    </div>

    <div id="commentsContainer">
      <div class="status-msg">جارٍ تحميل التعليقات...</div>
    </div>
  </div>

  <script>
    const wilayas = ["أدرار", "الشلف", "الأغواط", "أم البواقي", "باتنة", "بجاية", "بسكرة", "بشار", "البليدة", "البويرة",
      "تمنراست", "تبسة", "تلمسان", "تيارت", "تيزي وزو", "الجزائر", "الجلفة", "جيجل", "سطيف", "سعيدة",
      "سكيكدة", "سيدي بلعباس", "عنابة", "قالمة", "قسنطينة", "المدية", "مستغانم", "المسيلة", "معسكر", "ورقلة",
      "وهران", "البيض", "إليزي", "برج بوعريريج", "بومرداس", "الطارف", "تندوف", "تيسمسيلت", "الوادي", "خنشلة",
      "سوق أهراس", "تيبازة", "ميلة", "عين الدفلى", "النعامة", "عين تموشنت", "غرداية", "غليزان", "تميمون", "برج باجي مختار",
      "أولاد جلال", "بني عباس", "عين قزام", "تقرت", "جانت", "المغير", "المنيعة", "دار البيضاء"];

    const wilayaSelect = document.getElementById("wilaya");
    wilayas.forEach(w => {
      const option = document.createElement("option");
      option.value = w;
      option.textContent = w;
      wilayaSelect.appendChild(option);
    });

    const scriptURL = 'https://script.google.com/macros/s/AKfycbyMZECHoP06A15l8rueiAsRaTW7UCjZd5W0bT8KLxWe8yd5bjQIWpEMIlDAhxl-wjGr/exec?sheet=reviews';

    const clientID = localStorage.getItem("clientID") || (() => {
      const id = Date.now() + "-" + Math.random().toString(36).substring(2);
      localStorage.setItem("clientID", id);
      return id;
    })();

    // منع تكرار "إعجاب الموقع" أكثر من مرة من نفس الجهاز
    const hasLikedSite = () => localStorage.getItem("siteLiked") === "1";

    // ---------- أدوات مساعدة ----------

    // لمنع ثغرات XSS: تحويل أي نص خام إلى نص آمن قبل إدراجه في الصفحة
    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function setButtonLoading(btn, loadingText) {
      if (!btn) return;
      btn.dataset.originalText = btn.dataset.originalText || btn.textContent;
      btn.disabled = true;
      btn.textContent = loadingText;
    }
    function resetButton(btn) {
      if (!btn) return;
      btn.disabled = false;
      if (btn.dataset.originalText) btn.textContent = btn.dataset.originalText;
    }

    function updateCharCount() {
      const el = document.getElementById("comment");
      document.getElementById("charCount").textContent = `${el.value.length} / 500`;
    }

    // ---------- التعليقات ----------

    function addComment() {
      const nameEl = document.getElementById("name");
      const wilayaEl = document.getElementById("wilaya");
      const commentEl = document.getElementById("comment");

      const name = nameEl.value.trim();
      const wilaya = wilayaEl.value.trim();
      const comment = commentEl.value.trim();

      if (!name || !wilaya || !comment) {
        alert("يرجى تعبئة جميع الحقول");
        return;
      }

      const btn = document.getElementById("submitBtn");
      setButtonLoading(btn, "جارٍ الإرسال...");

      fetch(scriptURL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'addComment',
          name, wilaya, comment,
          client: clientID
        })
      })
        .then(res => {
          if (!res.ok) throw new Error("network");
          commentEl.value = "";
          updateCharCount();
          return getComments();
        })
        .catch(() => {
          alert("تعذر إرسال التعليق. يرجى المحاولة مرة أخرى.");
        })
        .finally(() => resetButton(btn));
    }

    function getComments() {
      const container = document.getElementById("commentsContainer");
      return fetch(scriptURL)
        .then(res => {
          if (!res.ok) throw new Error("network");
          return res.json();
        })
        .then(data => {
          container.innerHTML = "";

          if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<div class="status-msg">لا توجد تعليقات بعد. كن أول من يكتب رأيه!</div>';
            return;
          }

          [...data].reverse().forEach(c => {
            const el = document.createElement("div");
            el.className = "comment";

            const repliesHTML = (c.replies || [])
              .filter(r => r)
              .map(r => `<div>↪️ ${escapeHTML(r)}</div>`)
              .join("");

            el.innerHTML = `
              <strong>${escapeHTML(c.name)} (${escapeHTML(c.wilaya)})</strong><br>
              <small>${c.date ? new Date(c.date).toLocaleString('ar-DZ') : ''}</small><br><br>
              ${escapeHTML(c.comment)}<br><br>
              <span class="likes">❤️ ${Number(c.likes) || 0}</span>
              <button class="action-btn" data-action="like">أعجبني</button>
              <button class="action-btn" data-action="reply">رد</button>
              ${c.client === clientID ? `<button class="action-btn delete-btn" data-action="delete">🗑️ حذف</button>` : ""}
              <div class="reply-box" id="replies-${c.row}">${repliesHTML}</div>
            `;

            el.querySelector('[data-action="like"]').addEventListener('click', e => likeComment(c.row, e.target));
            el.querySelector('[data-action="reply"]').addEventListener('click', () => showReply(c.row));
            const delBtn = el.querySelector('[data-action="delete"]');
            if (delBtn) delBtn.addEventListener('click', e => deleteComment(c.row, e.target));

            container.appendChild(el);
          });
        })
        .catch(() => {
          container.innerHTML = '<div class="error-msg">تعذر تحميل التعليقات. تحقق من اتصالك بالإنترنت وحاول مجددًا.</div>';
        });
    }

    function likeComment(row, btn) {
      if (btn) btn.disabled = true;
      fetch(scriptURL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'likeComment',
          row, client: clientID
        })
      })
        .then(() => getComments())
        .catch(() => alert("تعذر تسجيل الإعجاب."))
        .finally(() => { if (btn) btn.disabled = false; });
    }

    function showReply(row) {
      const reply = prompt("اكتب ردك:");
      if (!reply || !reply.trim()) return;

      const name = document.getElementById("name").value.trim() || "زائر";
      const wilaya = document.getElementById("wilaya").value.trim() || "؟";

      fetch(scriptURL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'addReply',
          row, reply: reply.trim(), name, wilaya
        })
      })
        .then(() => getComments())
        .catch(() => alert("تعذر إرسال الرد."));
    }

    function deleteComment(row, btn) {
      if (!confirm("هل أنت متأكد أنك تريد حذف تعليقك؟")) return;
      if (btn) btn.disabled = true;

      fetch(scriptURL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'deleteComment',
          row, client: clientID
        })
      })
        .then(() => getComments())
        .catch(() => {
          alert("تعذر حذف التعليق.");
          if (btn) btn.disabled = false;
        });
    }

    // ---------- إعجاب الموقع ----------

    function likeSite() {
      if (hasLikedSite()) {
        alert("لقد أعجبت بالموقع من قبل، شكرًا لك!");
        return;
      }
      const btn = document.getElementById("siteLikeBtn");
      setButtonLoading(btn, "جارٍ التسجيل...");

      fetch(scriptURL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'likeSite',
          client: clientID
        })
      })
        .then(() => {
          localStorage.setItem("siteLiked", "1");
          return updateLikeCount();
        })
        .catch(() => alert("تعذر تسجيل الإعجاب. حاول مرة أخرى."))
        .finally(() => resetButton(btn));
    }

    function updateLikeCount() {
      return fetch(scriptURL + "&action=getSiteLikes")
        .then(res => res.text())
        .then(count => {
          document.getElementById("siteLikeStatus").innerText = `إعجاب الموقع: ❤️ ${count}`;
        })
        .catch(() => {
          document.getElementById("siteLikeStatus").innerText = "";
        });
    }

    window.onload = function () {
      getComments();
      updateLikeCount();
      updateCharCount();
      if (hasLikedSite()) {
        document.getElementById("siteLikeBtn").textContent = "❤️ أعجبك الموقع";
      }
    };
  </script>
</body>
</html>
